<!DOCTYPE html>
<html lang="en" translate="no" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Boot title is intentionally blank: JCEF onTitleChange fires with this value
         before React mounts, and Kotlin's isNotBlank guard will skip it automatically.
         This removes the dual-meaning of "Claude Code" (boot placeholder vs. legitimate
         reset-session title) so the real APP_NAME can be set explicitly by useDocumentTitle. -->
    <title></title>
    <!--
      FOUC guard: runs before the CSS bundle and React mount so a new JCEF tab
      paints the correct surface color and layout direction immediately instead
      of flashing white / re-flowing after mount. Mirrors
      webview/src/theme/bootstrapTheme.ts (resolveBootstrapTheme,
      resolveBootstrapDirection, resolveBootstrapLang) — keep all three in
      sync. The background colors MUST match --surface-base in src/index.css
      (light :root #FFFFFF, dark .dark #1A1A1A). Setting
      documentElement.style/attributes here is intentional (not a React
      component).
    -->
    <script>
      (function () {
        var bootLocale = 'en';
        var param = new URLSearchParams(location.search).get('theme');
        var prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved =
          param === 'dark'
            ? 'dark'
            : param === 'light'
              ? 'light'
              : prefersDark
                ? 'dark'
                : 'light';
        if (resolved === 'dark') {
          document.documentElement.classList.add('dark');
        }
        // Direct color values: CSS variables are not available yet at this point.
        document.documentElement.style.backgroundColor =
          resolved === 'dark' ? '#1A1A1A' : '#FFFFFF';

        // UI mirroring: no Kotlin-injected hint exists for this, so the only
        // source of truth is the persisted `uiDirection` setting in the
        // SettingsContext localStorage cache (key 'claude-code-settings').
        try {
          var stored = JSON.parse(localStorage.getItem('claude-code-settings') || 'null');
          var uiDirection = stored && stored.uiDirection;
          if (uiDirection === 'rtl') {
            document.documentElement.setAttribute('dir', 'rtl');
          }
        } catch (e) {
          /* localStorage unavailable or unparsable: keep static dir="ltr" */
        }

        // <html lang> (a11y correctness): uiLanguage is owned by
        // ClaudeSettingsContext, which has no localStorage cache of its own —
        // I18nLocaleSync.tsx writes a dedicated cache (key
        // 'claude-code-ui-language') on every sync for this exact purpose.
        // This map is a verbatim copy of LANGUAGE_TO_LOCALE in
        // webview/src/i18n/languageMap.ts (this script cannot import a module
        // before the bundle loads) — keep both, and resolveBootstrapLang in
        // bootstrapTheme.ts, in sync.
        try {
          var uiLanguage = localStorage.getItem('claude-code-ui-language');
          var languageToLocale = {
            english: 'en',
            korean: 'ko',
            japanese: 'ja',
            chinese: 'zh',
            'chinese-traditional': 'zh-TW',
            spanish: 'es',
            french: 'fr',
            german: 'de',
            portuguese: 'pt',
            russian: 'ru',
            persian: 'fa',
            arabic: 'ar',
          };
          var locale = (uiLanguage && languageToLocale[uiLanguage]) || 'en';
          document.documentElement.setAttribute('lang', locale);
          bootLocale = locale;
        } catch (e) {
          /* localStorage unavailable or unparsable: keep static lang="en" */
        }

        // Say something while the bundle is on its way.
        //
        // The page is served by a backend that may be on another machine: under
        // Remote Development it is the remote host, and the bundle travels over
        // the IDE's own channel. That took four to eight seconds in measurement,
        // during which the panel was a blank rectangle with no indication that
        // anything was happening (issue #292). Locally the same gap exists and is
        // simply too short to see, so the message needs no environment check — it
        // is replaced the moment React mounts either way.
        //
        // Written here rather than in a component because a component cannot run
        // until the very bundle being waited for has arrived.
        try {
          var loadingText = {
            en: 'Loading Claude Code…',
            ko: 'Claude Code를 불러오는 중…',
            ja: 'Claude Code を読み込んでいます…',
            zh: '正在加载 Claude Code…',
            'zh-TW': '正在載入 Claude Code…',
            es: 'Cargando Claude Code…',
            fr: 'Chargement de Claude Code…',
            de: 'Claude Code wird geladen…',
            pt: 'Carregando o Claude Code…',
            ru: 'Загрузка Claude Code…',
            fa: 'در حال بارگذاری Claude Code…',
            ar: 'جارٍ تحميل Claude Code…',
          };
          var root = document.getElementById('root');
          if (root) {
            var box = document.createElement('div');
            box.setAttribute('data-boot-loading', '');
            box.style.cssText =
              'position:fixed;inset:0;display:flex;align-items:center;' +
              'justify-content:center;font:400 0.8461rem/1.5 -apple-system,' +
              'BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;' +
              'color:' + (resolved === 'dark' ? '#8A8A8A' : '#767676') + ';' +
              'text-align:center;padding:0 24px;';
            box.textContent = loadingText[bootLocale] || loadingText.en;
            root.appendChild(box);
          }
        } catch (e) {
          /* A missing message is not worth failing the boot over. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
