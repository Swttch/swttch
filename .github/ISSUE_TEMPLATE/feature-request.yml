name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest this — ideas from users shape most of what we build.

        Tell us what you'd like to see. If you can also mention where it would fit into your day,
        that helps us build something that actually works for you rather than just something that
        matches the description.

        Rough ideas are very welcome. You don't need to have it all worked out.

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: |
        The feature or improvement you have in mind. As much or as little detail as you like.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
      description: |
        How would you use it, and what does that look like for you today? Knowing the situation
        helps us get the details right — and it's a big part of how we decide what to build next.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        Anything you've tried in the meantime, or other approaches you weighed. Workarounds are
        useful to know about — sometimes they point at an easier way in.

  - type: dropdown
    id: scope
    attributes:
      label: Affected Area
      description: Which part of the plugin does this relate to? Feel free to skip if you're unsure.
      multiple: true
      options:
        - Chat UI
        - Session Management
        - Settings
        - Permissions
        - File / Image Attachment
        - Streaming / Rendering
        - Backend (Node.js)
        - JetBrains Integration (Kotlin)
        - Browser Environment
        - Other

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / References
      description: |
        Mockups or sketches are great, and so is a screenshot of another tool doing it well
        (Cursor, the CLI, another plugin). Seeing a working example is often the fastest way for us
        to get it right.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else you'd like to add.
